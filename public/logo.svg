<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- 相机外框 - 渐变蓝色 -->
  <defs>
    <linearGradient id="cameraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#10B981;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 相机主体 -->
  <rect x="4" y="12" width="56" height="40" rx="8" fill="url(#cameraGrad)"/>

  <!-- 镜头外圈 -->
  <circle cx="32" cy="32" r="14" fill="#1E3A8A" opacity="0.3"/>
  <circle cx="32" cy="32" r="12" fill="url(#lensGrad)"/>

  <!-- 镜头内圈 -->
  <circle cx="32" cy="32" r="7" fill="#1E40AF"/>
  <circle cx="32" cy="32" r="4" fill="#3B82F6" opacity="0.8"/>

  <!-- 镜头高光 -->
  <ellipse cx="29" cy="29" rx="2" ry="1.5" fill="white" opacity="0.4"/>

  <!-- 扫描光线效果 -->
  <rect x="8" y="30" width="48" height="2" fill="url(#scanGrad)" opacity="0.9"/>

  <!-- 顶部闪光灯 -->
  <rect x="46" y="18" width="8" height="4" rx="2" fill="#FBBF24"/>
  <circle cx="50" cy="20" r="1.5" fill="#FEF3C7"/>

  <!-- 扫描箭头指示 -->
  <path d="M12 48 L16 52 L12 56" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <path d="M52 48 L48 52 L52 56" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
</svg>
